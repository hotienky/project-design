# Build the Docker image, push it to the private registry, then ask Coolify to
# redeploy. Configure in Settings → Secrets and variables → Actions:
#   secrets:   REGISTRY_USERNAME, REGISTRY_PASSWORD, COOLIFY_WEBHOOK, COOLIFY_TOKEN
#   variables: REGISTRY (e.g. registry.example.com), IMAGE_NAME (e.g. team/project-design)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify deploy
    needs: image
    runs-on: ubuntu-latest
    steps:
      # The webhook is the "Deploy Webhook" URL from the Coolify resource
      # (…/api/v1/deploy?uuid=<uuid>&force=false); the token needs the deploy ability.
      - name: POST deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
